<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGM Loop harness: play-through</title>
<script src="player.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 ui-monospace, monospace; margin: 16px; background: Canvas; color: CanvasText; }
  pre { white-space: pre-wrap; }
  .fail { color: #c00; } .pass { color: #080; }
</style>
</head>
<body>
<p>Play-through for cut rips: loop 2 times, fade 1 s (from li_cut.json). cut.flac is 3 s with the loop 1 s..3 s, so the
play-through timeline is 1 + 2 x 2 + 1 = 6 s. tail.flac has 3 s after the loop and must play as before.</p>
<button id="run">Run play-through checks</button>
<pre id="log"></pre>
<script>
const listeners = new Map();
const Events = {
  on(obj, name, fn) { if (!listeners.has(obj)) listeners.set(obj, []); listeners.get(obj).push({ name, fn }); },
  off(obj, name, fn) { listeners.set(obj, (listeners.get(obj) || []).filter((x) => !(x.name === name && x.fn === fn))); },
  trigger(obj, name, args) { for (const x of (listeners.get(obj) || []).slice()) if (x.name === name) x.fn({ type: name }, ...(args || [])); }
};
const store = new Map();
const appSettings = { get: (k, u) => store.get((u ? u + '-' : '') + k) ?? null, set: (k, v, u) => store.set((u ? u + '-' : '') + k, v) };
let repeatMode = 'RepeatNone';
const files = { cut: 'cut.flac', tail: 'tail.flac' };
const apiClient = {
  accessToken: () => 'tok',
  getUrl(path, params) {
    let m = path.match(/^Audio\/(\w+)\/stream$/);
    if (m) return files[m[1]] + '?static=' + params.static;
    m = path.match(/^VgmLoop\/Items\/(\w+)\/LoopInfo$/);
    if (m) return 'li_' + m[1] + '.json';
    throw new Error('unexpected url ' + path);
  },
  getJSON: (url) => fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
};
const deps = {
  events: Events, appSettings,
  appHost: { supports: () => false, getDeviceProfile: () => Promise.resolve({}) },
  ServerConnections: { currentApiClient: () => ({ getCurrentUserId: () => 'u1' }), getApiClient: () => apiClient },
  playbackManager: { getRepeatMode: () => repeatMode },
  loading: { show() {}, hide() {} }
};
const TICKS_3S = 30000000;
const opts = (id) => ({ url: files[id] + '?pm', item: { Id: id, ServerId: 's', Type: 'Audio' }, mediaSource: { Id: 'ms-' + id, RunTimeTicks: id === 'cut' ? TICKS_3S : 2 * TICKS_3S } });

const logEl = document.getElementById('log');
const results = [];
function log(s, cls) { const span = document.createElement('span'); if (cls) span.className = cls; span.textContent = s + '\n'; logEl.appendChild(span); }
function check(name, cond, extra) { results.push({ name, ok: !!cond }); log((cond ? 'PASS ' : 'FAIL ') + name + (extra !== undefined ? '  ' + JSON.stringify(extra) : ''), cond ? 'pass' : 'fail'); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const near = (a, b, tol) => Math.abs(a - b) <= tol;
const db = (x) => 20 * Math.log10(x);
function waitFor(player, name, ms) {
  return new Promise((resolve) => {
    const t = setTimeout(() => { Events.off(player, name, fn); resolve(null); }, ms);
    function fn(e, ...args) { clearTimeout(t); Events.off(player, name, fn); resolve(args); }
    Events.on(player, name, fn);
  });
}
function setRepeat(p, mode) { repeatMode = mode; Events.trigger(p, 'repeatmodechange'); }

document.getElementById('run').addEventListener('click', async () => {
  window.__done = false;
  try {
    const Cls = await window.VgmLoopPlayer();
    const p = new Cls(deps);
    appSettings.set('volume', 0.5);
    appSettings.set('selectAudioNormalization', 'Off', 'u1');
    const G = 0.5;

    // --- cut rip, Repeat off: play-through
    repeatMode = 'RepeatNone';
    let o = opts('cut');
    await p.play(o);
    const e = p._loop;
    check('cut: loop engine', p._engine === e);
    check('cut: play-through active, source loops', !!e.pt && e.source.loop === true, e.pt);
    check('cut: timeline = 1 + 2x2 + 1 = 6 s', e.pt && e.pt.fadeStart === 160000 && e.pt.end === 192000, e.pt);
    check('cut: seek bar length 6 s (mediaSource.RunTimeTicks)', o.mediaSource.RunTimeTicks === 60000000 && near(p.duration(), 6000, 1), [o.mediaSource.RunTimeTicks, p.duration()]);
    check('cut: full volume before the fade', near(e.gain.gain.value, G, 1e-3), e.gain.gain.value);

    // seek into the second pass: timeline 4.5 s -> file 2.5 s
    p.currentTime(4500);
    await sleep(50);
    check('cut: seek past the first pass maps into the loop', near(p.currentTime(), 4550, 80) && near(e._pos(), 80000 + 1600, 2600), [p.currentTime(), e._pos()]);

    // seek to mid-fade: 5.5 s -> about -30 dB
    p.currentTime(5500);
    await sleep(60);
    const midDb = db(e.gain.gain.value / G);
    check('cut: halfway through the fade is about -30 dB', midDb < -24 && midDb > -36, midDb);

    // runs out -> stopped, as a natural end, reported at the file end, seek bar length restored
    let stopped = waitFor(p, 'stopped', 3000);
    let posAtStop = null;
    const onStop = () => { posAtStop = p.currentTime(); }; Events.on(p, 'stopped', onStop);
    const t0 = performance.now();
    check('cut: ends after the fade', await stopped, Math.round(performance.now() - t0));
    Events.off(p, 'stopped', onStop);
    check('cut: ending counts as an automatic advance', p._isAutoAdvance());
    check('cut: stop reported at the file end (played)', near(posAtStop, 3000, 1), posAtStop);
    check('cut: seek bar length restored', o.mediaSource.RunTimeTicks === TICKS_3S, o.mediaSource.RunTimeTicks);

    // --- Repeat One during the fade: cancel it, ramp back up, keep looping
    o = opts('cut');
    await p.play(o);
    p.currentTime(5400);
    await sleep(80);
    const faded = e.gain.gain.value;
    setRepeat(p, 'RepeatOne');
    check('fade + Repeat One: play-through off, still looping', !e.pt && e.source.loop === true);
    check('fade + Repeat One: seek bar back to the file length', o.mediaSource.RunTimeTicks === TICKS_3S && near(p.duration(), 3000, 1));
    check('fade + Repeat One: position on the file timeline', p.currentTime() >= 1000 && p.currentTime() < 3000, p.currentTime());
    await sleep(700);
    check('fade + Repeat One: ramped back up', faded < 0.2 && near(e.gain.gain.value, G, 1e-3), [faded, e.gain.gain.value]);
    stopped = waitFor(p, 'stopped', 1500);
    check('fade + Repeat One: keeps looping (no stop)', !(await stopped));

    // --- leaving Repeat One mid-track: passes counted from that point
    p.currentTime(2000);
    await sleep(50);
    const before = p.currentTime();
    setRepeat(p, 'RepeatAll');
    check('One -> All on a cut rip: play-through on', !!e.pt && e.source.loop === true);
    check('One -> All: this pass is the first (timeline = file position now)', near(e.pt.v0, before * 32, 3200) && near(p.currentTime(), before, 100), [e.pt.v0, before, p.currentTime()]);
    check('One -> All: seek bar 6 s', o.mediaSource.RunTimeTicks === 60000000);
    setRepeat(p, 'RepeatNone');
    check('All -> None: play-through continues', !!e.pt);

    // stop mid play-through: report the timeline fraction of the file (not played yet)
    let stopPos = null;
    const onStop2 = () => { stopPos = p.currentTime(); }; Events.on(p, 'stopped', onStop2);
    await p.stop(false);
    Events.off(p, 'stopped', onStop2);
    check('stop mid play-through: reported below 90% (not played)', stopPos != null && stopPos < 0.9 * 3000, stopPos);
    check('stop: seek bar length restored', o.mediaSource.RunTimeTicks === TICKS_3S);

    // --- fade 0 s: silent exactly at the end of the last pass
    o = opts('cut');
    await p.play(o);
    e._ptSettings = { loops: 2, fade: 0 };
    p.currentTime(4800); // timeline end is now 5 s
    e._stopTimer(); // stand in for a late timer: only the scheduled gain can silence it now
    await sleep(80);
    const beforeEnd = e.gain.gain.value;
    await sleep(320);
    check('fade 0: full volume up to the end, silent right after (before the timer stops it)', near(beforeEnd, G, 1e-3) && !!e.source && e.gain.gain.value === 0, [beforeEnd, e.gain.gain.value]);
    e._startTimer();
    await sleep(400);
    check('fade 0: track has ended', !e.source);

    // --- file with a real ending: plays as before
    repeatMode = 'RepeatNone';
    o = opts('tail');
    await p.play(o);
    check('tail: no play-through, plays once', !e.pt && e.source.loop === false && near(p.duration(), 6000, 1) && o.mediaSource.RunTimeTicks === 2 * TICKS_3S);
    await p.stop(false);

    // --- per-browser switch
    localStorage.setItem('vgmloop.playthrough', 'off');
    o = opts('cut');
    await p.play(o);
    check('playthrough-off: cut rip plays once', !e.pt && e.source.loop === false && o.mediaSource.RunTimeTicks === TICKS_3S);
    await p.stop(false);
    localStorage.removeItem('vgmloop.playthrough');

    // --- Repeat One from the start: loops forever as before
    repeatMode = 'RepeatOne';
    o = opts('cut');
    await p.play(o);
    check('Repeat One: plain looping, no play-through', !e.pt && e.source.loop === true && o.mediaSource.RunTimeTicks === TICKS_3S);
    await p.stop(true);
  } catch (err) {
    check('no exception', false, String(err && err.stack || err));
  }
  const failed = results.filter((r) => !r.ok).length;
  log(`\n${results.length - failed}/${results.length} passed`, failed ? 'fail' : 'pass');
  window.__results = results; window.__done = true;
});
</script>
</body>
</html>
